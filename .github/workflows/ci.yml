name: easy-sso checks

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run catches newly published vulnerabilities between pushes.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install PostgreSQL test client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: make test
      - run: make check
      - run: make package
      - run: EASY_SSO_RELEASE_DIR="$PWD/bin/release" go test ./internal/updater -run TestPackagedRelease -count=1
      - run: python3 tools/check-public.py --history
